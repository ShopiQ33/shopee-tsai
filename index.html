<script>
const BACKEND_URL = "https://shopee-backend-xxgk.onrender.com";

// 喚醒並確認 Render 後端
async function wakeBackend() {
    console.log("正在確認 Shopee Backend 狀態...");

    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 120000);

    try {
        const response = await fetch(BACKEND_URL + "/", {
            method: "GET",
            cache: "no-store",
            signal: controller.signal
        });

        if (!response.ok) {
            throw new Error("後端回應錯誤：" + response.status);
        }

        const data = await response.json();

        if (data.status !== "ok") {
            throw new Error("後端尚未正常啟動");
        }

        console.log("Shopee Backend 已正常啟動！");
        return true;

    } catch (error) {
        console.error("後端連線失敗：", error);
        return false;

    } finally {
        clearTimeout(timeout);
    }
}

// 開啟網頁時自動喚醒
window.addEventListener("load", () => {
    wakeBackend();
});

// 單筆轉換
async function convertSingleUrl(url) {
    try {
        const response = await fetch(BACKEND_URL + "/convert", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ url })
        });

        const data = await response.json();

        if (!response.ok) {
            console.error("蝦皮轉換失敗：", data);
            return null;
        }

        return data.affiliate_url || null;

    } catch (error) {
        console.error("轉換連線錯誤：", error);
        return null;
    }
}

// 批量轉換
async function convert() {
    const rawInput = document.getElementById("urlInput").value;
    const button = document.getElementById("convertBtn");
    const resultBox = document.getElementById("resultBox");

    const urls = rawInput
        .split("\n")
        .map(url => url.trim())
        .filter(url =>
            url.length > 0 &&
            (url.includes("shopee") || url.includes("shp.ee"))
        );

    if (urls.length === 0) {
        alert("請輸入至少一個有效的 Shopee 商品連結！");
        return;
    }

    button.disabled = true;
    button.innerText = "⏳ 正在連接後端...";

    resultBox.innerHTML =
        '<span class="placeholder-text">正在連接 Shopee Backend，第一次啟動可能需要等待，請不要關閉網頁...</span>';

    try {
        // 先確認後端已經啟動
        const ready = await wakeBackend();

        if (!ready) {
            resultBox.innerHTML =
                '<span style="color:red;">後端連線失敗，請稍後重新嘗試。</span>';
            return;
        }

        button.innerText = `⏳ 正在轉換 (0/${urls.length})...`;

        const results = [];

        // 逐筆轉換，避免一次發送太多請求
        for (let i = 0; i < urls.length; i++) {
            button.innerText =
                `⏳ 正在轉換 (${i + 1}/${urls.length})...`;

            const link = await convertSingleUrl(urls[i]);
            results.push(link);
        }

        resultBox.innerHTML = "";

        let successCount = 0;

        results.forEach((link, index) => {
            const item = document.createElement("div");
            item.className = "result-item";

            if (link) {
                successCount++;

                const number = document.createElement("strong");
                number.textContent = (index + 1) + ". ";

                const anchor = document.createElement("a");
                anchor.href = link;
                anchor.target = "_blank";
                anchor.rel = "noopener noreferrer";
                anchor.textContent = link;

                item.appendChild(number);
                item.appendChild(anchor);

            } else {
                const errorText = document.createElement("span");
                errorText.style.color = "red";
                errorText.textContent =
                    "[轉換失敗] " + urls[index];

                item.textContent = (index + 1) + ". ";
                item.appendChild(errorText);
            }

            resultBox.appendChild(item);
        });

        const summary = document.createElement("div");
        summary.style.marginTop = "12px";
        summary.style.fontWeight = "bold";
        summary.textContent =
            `轉換完成：成功 ${successCount} 筆，失敗 ${urls.length - successCount} 筆`;

        resultBox.appendChild(summary);

    } catch (error) {
        console.error("批量轉換錯誤：", error);
        alert("轉換時發生錯誤，請重新嘗試！");

    } finally {
        button.disabled = false;
        button.innerText = "🚀 立即轉換連結";
    }
}

// 清空輸入與結果
function clearAll() {
    document.getElementById("urlInput").value = "";

    document.getElementById("resultBox").innerHTML =
        '<span class="placeholder-text">轉換完成的連結會顯示於此，點擊即可開新視窗...</span>';
}
</script>
