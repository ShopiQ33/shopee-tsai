<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>蝦皮專屬連結批量轉換器</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px 10px;
}

/* 右上角社群 ICON */
.top-icons {
    position: fixed;
    top: 15px;
    right: 15px;
    display: flex;
    gap: 10px;
    z-index: 999;
}

.icon {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 18px;
    font-weight: bold;
    text-decoration: none;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    transition: transform 0.2s ease;
}

.icon:hover {
    transform: scale(1.1);
}

.fb { background: #1877f2; }
.line { background: #06c755; }

/* 主卡片容器 */
.card {
    width: 100%;
    max-width: 520px;
    background: #ffffff;
    border-radius: 20px;
    padding: 28px 24px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.1);
}

.avatar-wrap {
    text-align: center;
    margin-bottom: 12px;
}

.avatar {
    width: 100px;
    height: 100px;
    object-fit: cover;
    border-radius: 50%;
    border: 4px solid #ffffff;
    box-shadow: 0 6px 16px rgba(0,0,0,0.12);
}

h1 {
    text-align: center;
    margin: 0 0 6px 0;
    font-size: 22px;
    color: #333333;
}

.sub {
    text-align: center;
    color: #777777;
    font-size: 13px;
    margin-bottom: 20px;
    line-height: 1.4;
}

/* 標籤美化 */
.section-label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    color: #444444;
    margin-bottom: 8px;
}

/* 多行輸入框美化 */
textarea {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: 1.5px solid #e2e8f0;
    font-size: 14px;
    line-height: 1.5;
    color: #333;
    background-color: #f8fafc;
    outline: none;
    resize: vertical;
    transition: all 0.25s ease;
    font-family: inherit;
}

textarea:focus {
    background-color: #ffffff;
    border-color: #ee4d2d;
    box-shadow: 0 0 0 3px rgba(238, 77, 45, 0.15);
}

/* 轉換按鈕美化 */
.main-btn {
    width: 100%;
    margin-top: 14px;
    padding: 15px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #ff5722, #ee4d2d);
    color: #ffffff;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(238, 77, 45, 0.3);
    transition: all 0.2s ease;
    -webkit-tap-highlight-color: transparent;
}

.main-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 8px 22px rgba(238, 77, 45, 0.4);
}

.main-btn:active {
    transform: translateY(1px);
}

/* 輸出結果區塊美化 */
.output {
    margin-top: 22px;
}

.result-list {
    min-height: 120px;
    max-height: 240px;
    overflow-y: auto;
    background: #f8fafc;
    border: 1.5px solid #e2e8f0;
    border-radius: 12px;
    padding: 14px;
    font-size: 14px;
    line-height: 1.6;
}

.result-item {
    margin-bottom: 10px;
    word-break: break-all;
}

.result-item a {
    color: #ee4d2d;
    font-weight: 600;
    text-decoration: underline;
}

.result-item a:hover {
    color: #ff5722;
}

.placeholder-text {
    color: #a0aec0;
}

/* 清空按鈕美化 */
.clear-btn {
    width: 100%;
    margin-top: 10px;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: #718096;
    color: #ffffff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s ease;
}

.clear-btn:hover {
    background: #4a5568;
}

/* 社群按鈕 */
.share {
    display: flex;
    gap: 10px;
    margin-top: 16px;
}

.share a {
    flex: 1;
    text-align: center;
    padding: 12px;
    border-radius: 10px;
    color: #ffffff;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    transition: opacity 0.2s ease;
}

.share a:hover {
    opacity: 0.9;
}

.line-btn { background: #06c755; }
.fb-btn { background: #1877f2; }
</style>
</head>

<body>

<!-- 右上角社群 ICON -->
<div class="top-icons">
    <a class="icon fb" href="https://www.facebook.com/share/1K6men2rjE/?mibextid=wwXIfr" target="_blank">f</a>
    <a class="icon line" href="https://reurl.cc/vGgQ31" target="_blank">L</a>
</div>

<div class="card">

    <div class="avatar-wrap">
        <img src="avatar.jpg" class="avatar" alt="Avatar">
    </div>

    <h1>蝦皮推廣連結轉換器</h1>

    <div class="sub">
        支援一次貼上多個商品連結（請一行貼一個）<br>一鍵轉換成專屬優惠推廣連結
    </div>

    <span class="section-label">📥 貼上蝦皮商品連結：</span>
    <textarea id="urlInput" rows="4" placeholder="請將蝦皮連結貼在這裡...&#10;例：&#10;https://shopee.tw/product/123/456&#10;https://shopee.tw/product/789/012"></textarea>

    <button onclick="convert()" id="convertBtn" class="main-btn">
        🚀 立即轉換連結
    </button>

    <div class="output">
        <span class="section-label">🔗 轉換後的專屬連結（可直接點擊跳轉）：</span>
        
        <!-- 可點擊超連結顯示區塊 -->
        <div id="resultBox" class="result-list">
            <span class="placeholder-text">轉換完成的連結會顯示於此，點擊即可開新視窗...</span>
        </div>

        <!-- 一鍵清空按鈕 -->
        <button class="clear-btn" onclick="clearAll()">
            🗑️ 清空所有內容
        </button>
    </div>

    <!-- 底部社群按鈕 -->
    <div class="share" id="share">
        <a href="https://reurl.cc/vGgQ31" class="line-btn" target="_blank">💬 加入 LINE 社群</a>
        <a href="https://www.facebook.com/share/1K6men2rjE/?mibextid=wwXIfr" class="fb-btn" target="_blank">👍 追蹤 FB 社團/粉專</a>
    </div>

</div>

<script>
async function convertSingleUrl(url) {
    try {
        const res = await fetch("https://shopee-backend-xxgk.onrender.com/convert", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ url })
        });

        if (!res.ok) return null;
        const data = await res.json();
        return data.affiliate_url || null;
    } catch (err) {
        return null;
    }
}

async function convert() {
    const rawInput = document.getElementById("urlInput").value;
    const button = document.getElementById("convertBtn");

    const urls = rawInput
        .split("\n")
        .map(u => u.trim())
        .filter(u => u.length > 0 && u.includes("shopee"))
        .map(u => u.split("?")[0]);

    if (urls.length === 0) {
        alert("請輸入至少一個有效的 Shopee 商品連結！");
        return;
    }

    button.innerText = `⏳ 轉換中 (0/${urls.length})...`;

    try {
        const fetchPromises = urls.map(async (url) => {
            return await convertSingleUrl(url);
        });

        const results = await Promise.all(fetchPromises);
        
        const resultBox = document.getElementById("resultBox");
        resultBox.innerHTML = ""; // 清空舊內容

        results.forEach((link, index) => {
            const item = document.createElement("div");
            item.className = "result-item";
            
            if (link) {
                item.innerHTML = `<strong>${index + 1}.</strong> <a href="${link}" target="_blank" rel="noopener noreferrer">${link}</a>`;
            } else {
                item.innerHTML = `<strong>${index + 1}.</strong> <span style="color:red;">[轉換失敗] ${urls[index]}</span>`;
            }
            resultBox.appendChild(item);
        });

    } catch (err) {
        alert("轉換時發生錯誤，請重試！");
    } finally {
        button.innerText = "🚀 立即轉換連結";
    }
}

// 🗑️ 清空輸入與結果區域
function clearAll() {
    document.getElementById("urlInput").value = "";
    document.getElementById("resultBox").innerHTML = '<span class="placeholder-text">轉換完成的連結會顯示於此，點擊即可開新視窗...</span>';
}
</script>

</body>
</html>
